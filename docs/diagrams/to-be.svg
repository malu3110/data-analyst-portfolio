5.0" y="131.66666666666669" font-size="11" text-anchor="middle">border</text><rect x="1355.0" y="208.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="1425.0" y="235.66666666666666" font-size="11" text-anchor="middle">Weekly: review</text><text x="1425.0" y="248.66666666666666" font-size="11" text-anchor="middle">crossing reliability &amp;</text><text x="1425.0" y="261.66666666666663" font-size="11" text-anchor="middle">FAST savings</text><rect x="0.0" y="720" width="375.0" height="46" fill="#d5e8d4" stroke="#82b366"/><text x="187.5" y="740.3333333333334" font-size="10" text-anchor="middle">Addresses PP1 via US-06 (typical wait by</text><text x="187.5" y="752.3333333333334" font-size="10" text-anchor="middle">hour)</text><rect x="385.0" y="720" width="375.0" height="46" fill="#d5e8d4" stroke="#82b366"/><text x="572.5" y="740.3333333333334" font-size="10" text-anchor="middle">Addresses PP2 via US-07 (compare</text><text x="572.5" y="752.3333333333334" font-size="10" text-anchor="middle">crossings)</text><rect x="770.0" y="720" width="375.0" height="46" fill="#d5e8d4" stroke="#82b366"/><text x="957.5" y="740.3333333333334" font-size="10" text-anchor="middle">Addresses PP3 via US-04/US-09 (history,</text><text x="957.5" y="752.3333333333334" font-size="10" text-anchor="middle">quality)</text><rect x="1155.0" y="720" width="375.0" height="46" fill="#d5e8d4" stroke="#82b366"/><text x="1342.5" y="740.3333333333334" font-size="10" text-anchor="middle">Human decides; dashboard informs (no</text><text x="1342.5" y="752.3333333333334" font-size="10" text-anchor="middle">auto-routing)</text></svg>