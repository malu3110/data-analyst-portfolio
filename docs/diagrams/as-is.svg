<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="660" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs><text x="4" y="30" font-size="15" font-weight="bold">AS-IS (assumed process, design exercise): crossing chosen from a single live snapshot</text><rect x="0" y="50" width="1360" height="130" fill="#f5f5f5" stroke="#999"/><rect x="0" y="50" width="140" height="130" fill="#e6e6e6" stroke="#999"/><text x="70.0" y="119.0" font-size="12" text-anchor="middle" font-weight="bold">Customer (shipper)</text><rect x="0" y="180" width="1360" height="130" fill="#fff" stroke="#999"/><rect x="0" y="180" width="140" height="130" fill="#e6e6e6" stroke="#999"/><text x="70.0" y="249.0" font-size="12" text-anchor="middle" font-weight="bold">Dispatcher</text><rect x="0" y="310" width="1360" height="130" fill="#f5f5f5" stroke="#999"/><rect x="0" y="310" width="140" height="130" fill="#e6e6e6" stroke="#999"/><text x="70.0" y="379.0" font-size="12" text-anchor="middle" font-weight="bold">Driver</text><rect x="0" y="440" width="1360" height="130" fill="#fff" stroke="#999"/><rect x="0" y="440" width="140" height="130" fill="#e6e6e6" stroke="#999"/><text x="70.0" y="509.0" font-size="12" text-anchor="middle" font-weight="bold">CBP wait-time website</text><line x1="283.38461538461536" y1="152.0" x2="356.61538461538464" y2="208.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="475.0" y1="245.0" x2="505.0" y2="245.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="575.0" y1="282.0" x2="575.0" y2="468.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="579.0" y="371.0" font-size="10" fill="#333">looks up</text><line x1="623.3846153846154" y1="282.0" x2="696.6153846153846" y2="338.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="664.0" y="306.0" font-size="10" fill="#333">release</text><line x1="815.0" y1="375.0" x2="845.0" y2="375.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><line x1="963.3846153846154" y1="338.0" x2="1036.6153846153845" y2="282.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="1004.0" y="306.0" font-size="10" fill="#333">Yes</text><line x1="985.0" y1="375.0" x2="1185.0" y2="375.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="1089.0" y="371.0" font-size="10" fill="#333">No / after wait</text><line x1="1133.3846153846155" y1="208.0" x2="1206.6153846153845" y2="152.0" stroke="#333" stroke-width="1.3" marker-end="url(#arr)"/><text x="1174.0" y="176.0" font-size="10" fill="#333">phone/email</text><rect x="165.0" y="78.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="235.0" y="105.66666666666667" font-size="11" text-anchor="middle">Tender cross-border</text><text x="235.0" y="118.66666666666667" font-size="11" text-anchor="middle">load with delivery</text><text x="235.0" y="131.66666666666669" font-size="11" text-anchor="middle">window</text><rect x="335.0" y="208.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="405.0" y="235.66666666666666" font-size="11" text-anchor="middle">Assign driver; pick</text><text x="405.0" y="248.66666666666666" font-size="11" text-anchor="middle">crossing (habitual</text><text x="405.0" y="261.66666666666663" font-size="11" text-anchor="middle">default)</text><rect x="505.0" y="208.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="575.0" y="242.16666666666666" font-size="11" text-anchor="middle">Check current wait for</text><text x="575.0" y="255.16666666666666" font-size="11" text-anchor="middle">that one crossing</text><rect x="505.0" y="468.0" width="140" height="74" rx="8" fill="#d5e8d4" stroke="#82b366"/><text x="575.0" y="502.1666666666667" font-size="11" text-anchor="middle">Shows current snapshot</text><text x="575.0" y="515.1666666666667" font-size="11" text-anchor="middle">only (no history)</text><rect x="675.0" y="338.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="745.0" y="372.1666666666667" font-size="11" text-anchor="middle">Drive to crossing;</text><text x="745.0" y="385.1666666666667" font-size="11" text-anchor="middle">join commercial queue</text><polygon points="915.0,338.0 985.0,375.0 915.0,412.0 845.0,375.0" fill="#fff2cc" stroke="#d6b656"/><text x="915.0" y="366.3333333333333" font-size="10" text-anchor="middle">Queue much</text><text x="915.0" y="378.3333333333333" font-size="10" text-anchor="middle">longer than</text><text x="915.0" y="390.3333333333333" font-size="10" text-anchor="middle">expected?</text><rect x="1015.0" y="208.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="1085.0" y="242.16666666666666" font-size="11" text-anchor="middle">Driver phones in;</text><text x="1085.0" y="255.16666666666666" font-size="11" text-anchor="middle">revise ETA manually</text><rect x="1185.0" y="78.0" width="140" height="74" rx="8" fill="#dae8fc" stroke="#6c8ebf"/><text x="1255.0" y="112.16666666666667" font-size="11" text-anchor="middle">Receives late,</text><text x="1255.0" y="125.16666666666667" font-size="11" text-anchor="middle">reactive ETA change</text><ellipse cx="1255.0" cy="375.0" rx="70.0" ry="37.0" fill="#f5f5f5" stroke="#666666"/><text x="1255.0" y="372.1666666666667" font-size="11" text-anchor="middle">Cross (eventually);</text><text x="1255.0" y="385.1666666666667" font-size="11" text-anchor="middle">continue to delivery</text><rect x="0.0" y="590" width="332.5" height="46" fill="#f8cecc" stroke="#b85450"/><text x="166.25" y="610.3333333333334" font-size="10" text-anchor="middle">PP1 Snapshot only: no view of wait at</text><text x="166.25" y="622.3333333333334" font-size="10" text-anchor="middle">arrival hour</text><rect x="342.5" y="590" width="332.5" height="46" fill="#f8cecc" stroke="#b85450"/><text x="508.75" y="610.3333333333334" font-size="10" text-anchor="middle">PP2 Crossing chosen by habit, not</text><text x="508.75" y="622.3333333333334" font-size="10" text-anchor="middle">comparison</text><rect x="685.0" y="590" width="332.5" height="46" fill="#f8cecc" stroke="#b85450"/><text x="851.25" y="616.3333333333334" font-size="10" text-anchor="middle">PP3 Delays never recorded: no learning</text><rect x="1027.5" y="590" width="332.5" height="46" fill="#f8cecc" stroke="#b85450"/><text x="1193.75" y="610.3333333333334" font-size="10" text-anchor="middle">PP4 ETA changes are reactive and</text><text x="1193.75" y="622.3333333333334" font-size="10" text-anchor="middle">phone-driven</text></svg>