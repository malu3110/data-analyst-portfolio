version: 2
unit_tests:
  - name: lane_update_time_date_inference
    description: >
      CBP update times carry a local time-of-day and zone but no date. Covers:
      same-day reading, a reading from the previous day (stale), a reading taken
      before local midnight and captured after it, and missing values staying NULL.
    model: stg_cbp__commercial_lane_readings
    given:
      - input: source('raw', 'cbp_snapshot')
        format: sql
        rows: |
          select 1::bigint as snapshot_id, '2026-10-01 09:15:00+00'::timestamptz as captured_at,
                 'a' as payload_sha256, 3 as record_count,
                 '[
                   {"port_number": "300401", "commercial_vehicle_lanes": {"maximum_lanes": "3",
                     "standard_lanes": {"update_time": "At 2:00 am PDT", "operational_status": "no delay", "delay_minutes": "5", "lanes_open": "1"},
                     "FAST_lanes": {"update_time": "", "operational_status": "Update Pending", "delay_minutes": "", "lanes_open": ""}}},
                   {"port_number": "070801", "commercial_vehicle_lanes": {"maximum_lanes": "5",
                     "standard_lanes": {"update_time": "At 6:00 am EDT", "operational_status": "no delay", "delay_minutes": "0", "lanes_open": "1"},
                     "FAST_lanes": {"update_time": "", "operational_status": "no delay", "delay_minutes": "", "lanes_open": ""}}},
                   {"port_number": "999999", "commercial_vehicle_lanes": {"maximum_lanes": "N/A"}}
                 ]'::jsonb as payload
          union all
          select 2::bigint, '2026-10-01 05:30:00+00'::timestamptz, 'b', 1,
                 '[{"port_number": "230401", "commercial_vehicle_lanes": {"maximum_lanes": "8",
                     "standard_lanes": {"update_time": "At 11:00 pm CDT", "operational_status": "delay", "delay_minutes": "45", "lanes_open": "6"}}}]'::jsonb
      - input: ref('tz_abbreviations')
        rows:
          - {tz_abbrev: PDT, utc_offset_hours: -7}
          - {tz_abbrev: EDT, utc_offset_hours: -4}
          - {tz_abbrev: CDT, utc_offset_hours: -5}
    expect:
      rows:
        # same day: 2:00 PDT = 09:00 UTC, 15 min before capture
        - {port_number: "300401", lane_type: standard, cbp_updated_at: "2026-10-01 09:00:00+00", reading_age_minutes: 15, is_stale: false, delay_minutes: 5, local_hour: 2, reading_status: reported}
        # pending FAST lane: NULL delay, never 0
        - {port_number: "300401", lane_type: fast, cbp_updated_at: null, reading_age_minutes: null, is_stale: false, delay_minutes: null, local_hour: null, reading_status: pending}
        # 6:00 EDT is after the 05:15 EDT capture, so it must be yesterday's reading
        - {port_number: "070801", lane_type: standard, cbp_updated_at: "2026-09-30 10:00:00+00", reading_age_minutes: 1395, is_stale: true, delay_minutes: 0, local_hour: 6, reading_status: reported}
        # "no delay" with a blank delay is not treated as 0
        - {port_number: "070801", lane_type: fast, cbp_updated_at: null, reading_age_minutes: null, is_stale: false, delay_minutes: null, local_hour: null, reading_status: unparsed}
        # captured 00:30 CDT Oct 1; 11:00 pm CDT is Sep 30 = 04:00 UTC Oct 1
        - {port_number: "230401", lane_type: standard, cbp_updated_at: "2026-10-01 04:00:00+00", reading_age_minutes: 90, is_stale: false, delay_minutes: 45, local_hour: 23, reading_status: reported}
